name: Build and Release M ERP

on:
  push:
    tags:
      - "v*.*.*"

# Required so electron-builder can create/update the GitHub Release
permissions:
  contents: write

# Prevent duplicate workflow runs for the same tag if pushed twice quickly
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      # ---------------------------------------------------------
      # 1. Download source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Install Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 3.5 Install Laravel Composer Dependencies
      # ---------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          
      - name: Install Composer Dependencies
        working-directory: runtime/Laravel
        run: composer install --no-dev --optimize-autoloader
        
      - name: Verify autoload.php
        shell: pwsh
        run: |
          if (-Not (Test-Path "runtime/Laravel/vendor/autoload.php")) {
            Write-Error "CRITICAL: runtime/Laravel/vendor/autoload.php is missing. Composer installation failed or generated files in the wrong directory."
            exit 1
          }

      # ---------------------------------------------------------
      # 4. Build Windows installer
      #
      # electron-builder will:
      # - build Electron application
      # - package runtime
      # - create NSIS installer
      # - generate latest.yml
      # - generate blockmap
      # - publish everything to GitHub Release
      # ---------------------------------------------------------
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always